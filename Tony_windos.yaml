# clash
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: '0.0.0.0:9090'
unified-delay: true
geox-url:
  mmdb: 'https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.metadb'
  geosite: https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  geoip: https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat
  asn: https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
dns:
  enable: true
  listen: '0.0.0.0:1053'
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5

  nameserver:
    - https://223.5.5.5/dns-query
    - https://dns.alidns.com/dns-query

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  fake-ip-filter:
    - +.lan
    - +.local

sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080]

proxy-providers:
  sangmao:
    type: http
    url: "https://sub-1.smjcdh.top/smjc/api/v1/client/subscribe?token=518d2a3225a9d4354270d7b1b638a009"
    interval: 3600
    path: /etc/nikki/run/sangmao.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
    
  peiqian:
    type: http
    url: "https://dash.pqjc.site/api/v1/pq/0d6df37abcccd64f6ab7132ef802fac4"
    interval: 3600
    path: /etc/nikki/run/peiqian.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

