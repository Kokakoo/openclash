proxy-groups:
  # ================= 核心功能组 =================
  - {name: 🐸 三毛机场, type: select, use: [sangmao]}
  - {name: 🐸 赔钱机场, type: select, use: [peiqian]}
  - {name: 🐸 自建节点, type: select, proxies: ['tuic-443', 'vless-54562']}

  - name: "♻️ 故障转移"
    type: fallback
    use: 
      - sangmao
      - peiqian
    url: 'http://www.gstatic.com/generate_204'
    interval: 7200

  - name: "🦄 自动选择"
    type: url-test
    use:
      - sangmao
      - peiqian
    url: 'http://www.gstatic.com/generate_204'
    interval: 86400

  - {name: 🤖 AI, type: select, proxies: [🐸 自建节点]}
  - {name: 🌍 国外媒体, type: select, proxies: [🐸 三毛机场,🐸 赔钱机场,🦄 自动选择,♻️ 故障转移]}
